name: Fixture checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -c requirements-lock.txt -e '.[dev]'
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m pytest -q
      # Tests use tiny generated fixtures and committed aggregate results only.
      # Never run churn run-all or download customer data in CI.
