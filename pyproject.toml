[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-prediction-ml"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "duckdb==1.4.1", "openpyxl==3.1.5", "pyarrow==22.0.0",
  "numpy==2.3.4", "pandas==2.3.3", "scipy==1.16.3", "scikit-learn==1.7.2",
  "lightgbm==4.6.0", "shap==0.49.1", "matplotlib==3.10.7", "streamlit==1.66.1",
  "joblib==1.5.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.3"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["churn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
